name: SECS/GEM Simulator Windows Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "simulator/**"
      - "simulator_gui/**"
      - "gateway/**"
      - "eap_middleware/profiles/**"
      - "packaging/secsgem_simulator/**"
      - "tests/test_simulator_*.py"
      - "tests/test_host_simulator_loopback.py"
      - "tests/test_davinci_packaged_runner_e2e.py"
      - "tests/test_davinci_windows_packaging.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - ".github/workflows/secsgem-simulator-windows.yml"

jobs:
  build-and-smoke:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r packaging/secsgem_simulator/requirements-build.txt

      - name: Run test suite
        run: python -m pytest -q tests

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows package
        shell: pwsh
        run: ./packaging/secsgem_simulator/build_windows.ps1 -SkipTests

      - name: Smoke-test packaged executable in both directions and both roles
        run: >-
          python packaging/secsgem_simulator/smoke_packaged_exe.py
          --exe .build/secsgem-simulator/dist/SecsGemSimulator/SecsGemSimulator.exe
          --output-dir .build/secsgem-simulator/smoke-logs

      # The panel is the package's primary entry point, so a build that
      # silently dropped it must fail here rather than at an operator's desk.
      - name: Verify the control panel was packaged
        shell: pwsh
        run: |
          $gui = ".build/secsgem-simulator/dist/SecsGemSimulator/AstarSimulatorGui.exe"
          if (-not (Test-Path $gui)) { throw "Control panel missing from the package: $gui" }

      - name: Install and smoke-test Setup EXE
        shell: pwsh
        run: >-
          ./packaging/secsgem_simulator/smoke_installer.ps1
          -Installer artifacts/secsgem-simulator/SecsGemSimulator-Setup-1.0.0-win-x64.exe
          -Python python
          -OutputDir .build/secsgem-simulator/installer-smoke-logs

      - name: Upload packaged-executable smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SecsGemSimulator-1.0.0-smoke-logs
          path: .build/secsgem-simulator/smoke-logs
          if-no-files-found: warn

      - name: Upload installer smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SecsGemSimulator-1.0.0-installer-smoke-logs
          path: .build/secsgem-simulator/installer-smoke-logs
          if-no-files-found: warn

      - name: Upload package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SecsGemSimulator-1.0.0-win-x64
          path: |
            artifacts/secsgem-simulator/SecsGemSimulator-1.0.0-win-x64.zip
            artifacts/secsgem-simulator/SecsGemSimulator-1.0.0-win-x64.zip.sha256
            artifacts/secsgem-simulator/SecsGemSimulator-Setup-1.0.0-win-x64.exe
            artifacts/secsgem-simulator/SecsGemSimulator-Setup-1.0.0-win-x64.exe.sha256
          if-no-files-found: error
